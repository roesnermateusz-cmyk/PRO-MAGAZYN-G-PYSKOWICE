# Budowanie i test instalatora Windows na prawdziwym systemie Windows.
#
# Przebieg:
#   1. npm run verify      - typecheck, lint, testy, build serwera i klienta
#   2. npm run dist        - instalator NSIS (jeden plik .exe)
#   3. kontrola artefaktu  - dokładnie jeden plik, suma SHA-256
#   4. test dymny          - cicha instalacja, uruchomienie zainstalowanego
#                            serwera, /api/health, aplikacja kliencka,
#                            egzekwowanie uwierzytelniania, cicha deinstalacja
#                            z zachowaniem katalogu danych
#   5. artefakt            - plik .exe + .sha256 do pobrania z zakładki Actions
#
# Uruchamiane przy każdym wypchnięciu na gałęzie robocze i main oraz ręcznie.

name: Instalator Windows

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build i test na Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Zależności (serwer + klient)
        run: npm ci

      - name: Weryfikacja (typecheck, lint, testy, build)
        run: npm run verify

      - name: Zależności (powłoka desktop)
        working-directory: desktop
        run: npm ci

      - name: Budowanie instalatora
        working-directory: desktop
        run: npm run dist

      - name: Kontrola artefaktu i suma SHA-256
        id: artifact
        working-directory: desktop/release
        shell: pwsh
        run: |
          $exe = Get-ChildItem -File -Filter '*.exe'
          if ($exe.Count -ne 1) {
            Write-Error "Oczekiwano dokładnie jednego pliku .exe, znaleziono: $($exe.Count)"
            exit 1
          }
          $name = $exe[0].Name
          $hash = (Get-FileHash $exe[0].FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content -NoNewline -Encoding ascii "$name.sha256"
          Write-Host "Plik:    $name ($($exe[0].Length) B)"
          Write-Host "SHA-256: $hash"
          "name=$name" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Test dymny - cicha instalacja
        shell: pwsh
        run: |
          $setup = Join-Path $env:GITHUB_WORKSPACE "desktop\release\${{ steps.artifact.outputs.name }}"
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Instalator zakończył się kodem $($p.ExitCode)"; exit 1 }

          $app = 'C:\Program Files\ResInvest ERP'
          foreach ($f in @(
            "$app\ResInvest ERP.exe",
            "$app\Uninstall ResInvest ERP.exe",
            "$app\resources\app.asar",
            "$app\resources\app.asar.unpacked\node_modules\better-sqlite3\build\Release\better_sqlite3.node",
            "$app\resources\app.asar.unpacked\server\index.js",
            "$app\resources\app.asar.unpacked\server\db\migrations\001_init.sql",
            "$app\resources\app.asar.unpacked\client\index.html"
          )) {
            if (-not (Test-Path $f)) { Write-Error "Brak pliku po instalacji: $f"; exit 1 }
          }
          foreach ($d in @('C:\ProgramData\ResInvestERP', 'C:\ProgramData\ResInvestERP\attachments', 'C:\ProgramData\ResInvestERP\backups')) {
            if (-not (Test-Path $d)) { Write-Error "Brak katalogu danych: $d"; exit 1 }
          }
          $rule = Get-NetFirewallRule -DisplayName 'ResInvest ERP' -ErrorAction SilentlyContinue
          if (-not $rule) { Write-Error "Brak reguły zapory 'ResInvest ERP'"; exit 1 }
          Write-Host "Instalacja poprawna: program, moduł natywny, migracje, klient, katalog danych, reguła zapory."

      - name: Test dymny - zainstalowany serwer
        shell: pwsh
        run: |
          $app = 'C:\Program Files\ResInvest ERP'
          $data = Join-Path $env:RUNNER_TEMP 'resinvest-smoke'
          New-Item -ItemType Directory -Force $data | Out-Null

          # Serwer uruchamiany dokładnie tak, jak robi to powłoka Electrona (main.js):
          # zainstalowany plik .exe w trybie Node (ELECTRON_RUN_AS_NODE) + ładunek serwera.
          $env:ELECTRON_RUN_AS_NODE = '1'
          $env:NODE_ENV = 'production'
          $env:APP_VERSION = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $env:HOST = '127.0.0.1'
          $env:PORT = '4321'
          $env:DATA_DIR = $data
          $env:CLIENT_DIST = "$app\resources\app.asar.unpacked\client"
          $env:SERVE_CLIENT = 'true'
          $env:CORS_ORIGINS = 'http://127.0.0.1:4321'
          $env:JWT_SECRET = -join ((1..64) | ForEach-Object { '{0:x}' -f (Get-Random -Maximum 16) })
          $env:REFRESH_SECRET = -join ((1..64) | ForEach-Object { '{0:x}' -f (Get-Random -Maximum 16) })
          $env:BACKUP_ENABLED = 'false'

          $log = Join-Path $data 'server.log'
          $proc = Start-Process -FilePath "$app\ResInvest ERP.exe" `
            -ArgumentList "`"$app\resources\app.asar.unpacked\server\index.js`"" `
            -RedirectStandardOutput $log -RedirectStandardError (Join-Path $data 'server.err') -PassThru

          $ok = $false
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 1
            try {
              $h = Invoke-RestMethod -Uri 'http://127.0.0.1:4321/api/health' -TimeoutSec 3
              if ($h.status -eq 'ok') { $ok = $true; break }
            } catch {}
            if ($proc.HasExited) { break }
          }
          if (-not $ok) {
            Write-Host "--- server.log ---"; Get-Content $log -ErrorAction SilentlyContinue
            Write-Host "--- server.err ---"; Get-Content (Join-Path $data 'server.err') -ErrorAction SilentlyContinue
            Write-Error "Serwer nie odpowiedział na /api/health"; exit 1
          }
          Write-Host "Health: status=$($h.status) version=$($h.version)"
          if ($h.version -ne $env:APP_VERSION) { Write-Error "Wersja z API ($($h.version)) różni się od manifestu ($env:APP_VERSION)"; exit 1 }

          $spa = Invoke-WebRequest -Uri 'http://127.0.0.1:4321/' -UseBasicParsing
          if ($spa.StatusCode -ne 200 -or $spa.Content -notmatch '<div id="root">') { Write-Error "Aplikacja kliencka nie jest serwowana"; exit 1 }

          # Bez tokenu chroniony zasób musi odpowiedzieć 401 - dowód, że uprawnienia
          # są egzekwowane przez serwer, a nie tylko przez interfejs.
          try {
            Invoke-WebRequest -Uri 'http://127.0.0.1:4321/api/documents' -UseBasicParsing | Out-Null
            Write-Error "Chroniony zasób odpowiedział bez uwierzytelnienia"; exit 1
          } catch {
            $code = [int]$_.Exception.Response.StatusCode
            if ($code -ne 401) { Write-Error "Oczekiwano 401, otrzymano $code"; exit 1 }
          }
          if (-not (Test-Path (Join-Path $data 'resinvest.sqlite'))) { Write-Error "Nie utworzono pliku bazy danych"; exit 1 }

          # Najważniejszy test: czy po instalacji DA SIĘ ZALOGOWAĆ.
          # Sama odpowiedź /api/health nic o tym nie mówi - serwer odpowiada
          # także wtedy, gdy w bazie nie ma żadnego konta.
          $creds = Join-Path $data 'PIERWSZE-URUCHOMIENIE.txt'
          if (-not (Test-Path $creds)) { Write-Error "Brak pliku z danymi pierwszego logowania"; exit 1 }
          $haslo = (Select-String -Path $creds -Pattern '^\s*Hasło:\s*(\S+)').Matches[0].Groups[1].Value
          if (-not $haslo) { Write-Error "Nie odczytano hasła początkowego"; exit 1 }

          $body = @{ login = 'admin'; password = $haslo } | ConvertTo-Json
          $zalogowany = Invoke-RestMethod -Uri 'http://127.0.0.1:4321/api/auth/login' -Method Post -Body $body -ContentType 'application/json'
          if ($zalogowany.user.login -ne 'admin') { Write-Error "Logowanie nie zwróciło konta admin"; exit 1 }
          if ($zalogowany.user.roleCode -ne 'ADMIN') { Write-Error "Konto admin nie ma roli ADMIN"; exit 1 }
          if ($zalogowany.user.permissions.Count -lt 1) { Write-Error "Konto admin nie ma zadnych uprawnień"; exit 1 }
          if (-not $zalogowany.user.mustChangePassword) { Write-Error "Nie wymuszono zmiany hasła początkowego"; exit 1 }
          # Tokeny zwracane sa na najwyzszym poziomie odpowiedzi (res.json({...tokens, ...})).
          if (-not $zalogowany.accessToken) { Write-Error "Logowanie nie zwróciło tokenu dostępu"; exit 1 }
          if (-not $zalogowany.refreshToken) { Write-Error "Logowanie nie zwróciło tokenu odświeżania"; exit 1 }
          Write-Host "Logowanie: admin, rola $($zalogowany.user.roleCode), uprawnień $($zalogowany.user.permissions.Count), wymuszona zmiana hasła."

          # Token z logowania musi otwierać zasób, ktory bez niego dawal 401.
          $naglowki = @{ Authorization = "Bearer $($zalogowany.accessToken)" }
          $dokumenty = Invoke-RestMethod -Uri 'http://127.0.0.1:4321/api/documents' -Headers $naglowki
          if ($null -eq $dokumenty) { Write-Error "Zalogowany nie odczytał listy dokumentów"; exit 1 }

          # Błędne hasło nadal musi być odrzucane.
          $zleBody = @{ login = 'admin'; password = 'zupelnie-zle-haslo-123' } | ConvertTo-Json
          try {
            Invoke-RestMethod -Uri 'http://127.0.0.1:4321/api/auth/login' -Method Post -Body $zleBody -ContentType 'application/json' | Out-Null
            Write-Error "Zalogowano błędnym hasłem"; exit 1
          } catch {
            $kod = [int]$_.Exception.Response.StatusCode
            if ($kod -ne 401) { Write-Error "Przy błędnym haśle oczekiwano 401, otrzymano $kod"; exit 1 }
          }

          Write-Host "Serwer z instalacji działa: health OK, wersja zgodna, klient serwowany, logowanie działa, 401 bez tokenu i przy błędnym haśle, baza utworzona."

          Stop-Process -Id $proc.Id -Force
          Start-Sleep -Seconds 2

      - name: Test dymny - cicha deinstalacja zachowuje dane
        shell: pwsh
        run: |
          $app = 'C:\Program Files\ResInvest ERP'
          $p = Start-Process -FilePath "$app\Uninstall ResInvest ERP.exe" -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Deinstalator zakończył się kodem $($p.ExitCode)"; exit 1 }
          Start-Sleep -Seconds 5
          if (Test-Path "$app\ResInvest ERP.exe") { Write-Error "Program nie został usunięty"; exit 1 }
          if (-not (Test-Path 'C:\ProgramData\ResInvestERP')) { Write-Error "Deinstalacja usunęła katalog danych - niedopuszczalne"; exit 1 }
          if (Get-NetFirewallRule -DisplayName 'ResInvest ERP' -ErrorAction SilentlyContinue) { Write-Error "Reguła zapory nie została usunięta"; exit 1 }
          Write-Host "Deinstalacja poprawna: program usunięty, dane zachowane, reguła zapory usunięta."

      # Artefakt publikujemy nawet przy nieudanym teście dymnym - plik jest wtedy
      # potrzebny do analizy problemu.
      - name: Artefakt - instalator
        if: always() && steps.artifact.outputs.name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            desktop/release/${{ steps.artifact.outputs.name }}
            desktop/release/${{ steps.artifact.outputs.name }}.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
