<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F8F6">
<title>ResInvest ERP · Magazyn Biomasy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   ResInvest ERP — warstwa wizualna v3 · Minimal Light
   Biel + jasne szarości + pastelowe akcenty · zieleń biomasy leśnej
   Inter / IBM Plex Mono · nazwy klas i zmiennych zachowane 1:1 (silnik JS)
   ===================================================================== */
:root{
  color-scheme:light;
  /* — powierzchnie — */
  --paper:#F5F8F6;          /* tło aplikacji: złamana biel z nutą zieleni */
  --surface:#FFFFFF;        /* karty */
  --surface-2:#F7FAF8;      /* panele wewnętrzne, nagłówki tabel */
  --field:#FFFFFF;          /* pola formularzy */
  --line:#E4EBE5;           /* obrysy */
  --line-2:#D2DDD4;         /* obrysy mocniejsze */
  /* — tekst — */
  --ink:#1B2B21;
  --ink-2:#66786C;
  --ink-3:#93A399;
  /* — kolor główny: zieleń biomasy — */
  --spruce:#2E9E5B;
  --moss:#238A4C;
  --spruce-deep:#1C5E3A;    /* głęboka zieleń: pasek obliczeń, toast, teksty akcentowe */
  --green-tint:#E7F4EB;     /* pastelowy podkład zielony */
  /* — akcent wtórny: bursztyn (WZ / sprzedaż) — */
  --amber:#C89A3C;
  --gold:#8F7418;
  --amber-soft:#FBF4E1;
  /* — statusy — */
  --neg:#C94F44;
  --pos:#238A4C;
  /* — geometria i typografia — */
  --radius:14px;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-disp:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --shadow:0 1px 2px rgba(18,46,30,.05),0 10px 28px -14px rgba(18,46,30,.10);
  --ring:0 0 0 3px rgba(46,158,91,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font-body);background:var(--paper);color:var(--ink);font-size:14.5px;line-height:1.5;min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14.5px;color:var(--ink)}
::selection{background:rgba(46,158,91,.22)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#CBD8CE;border-radius:8px;border:2px solid var(--paper)}
::-webkit-scrollbar-thumb:hover{background:#B4C6B9}
:focus-visible{outline:2px solid var(--spruce);outline-offset:2px}

@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.975) translateY(6px)}to{opacity:1;transform:none}}
#view>*{animation:rise .22s ease both}

/* ---------- Szkielet ---------- */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{background:#FFFFFF;border-right:1px solid var(--line);color:var(--ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:22px 20px 18px;border-bottom:1px solid var(--line)}
.brand .logo{font-weight:800;font-size:17px;letter-spacing:-.02em;line-height:1.2;color:var(--ink);display:flex;align-items:center;gap:9px}
.brand .logo::before{content:"";width:26px;height:26px;flex:none;border-radius:8px;
  background:linear-gradient(135deg,#3FB36C,#1C5E3A);
  clip-path:polygon(50% 0%, 92% 22%, 100% 62%, 74% 100%, 26% 100%, 0% 62%, 8% 22%);}
.brand .logo em{font-style:normal;color:var(--spruce)}
.brand .sub{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-top:6px;font-weight:600}
nav.menu{padding:12px 10px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.menu a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:13.5px;transition:background .15s,color .15s}
.menu a svg{width:18px;height:18px;flex:none;opacity:.75;transition:opacity .15s}
.menu a:hover{background:var(--surface-2);color:var(--ink)}
.menu a:hover svg{opacity:1}
.menu a.active{background:var(--green-tint);color:var(--spruce-deep);font-weight:600}
.menu a.active svg{opacity:1}
.side-foot{padding:14px 20px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3);line-height:1.55}
.side-foot b{color:var(--ink-2);font-weight:600}

main{padding:26px 32px 90px;max-width:1220px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{font-weight:700;font-size:24px;letter-spacing:-.02em;color:var(--ink)}
.page-head .crumb{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;font-weight:500}

/* ---------- Ikony globalne i wybór języka ---------- */
.app-tools{position:fixed;right:24px;top:18px;z-index:55;display:flex;align-items:center;gap:8px;padding:5px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.app-tool{width:34px;height:34px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;transition:background .15s,color .15s,border-color .15s}
.app-tool:hover{background:var(--surface-2);color:var(--spruce-deep);border-color:var(--line)}
.app-tool svg{width:17px;height:17px}
.lang-box{display:flex;align-items:center;gap:6px;border-left:1px solid var(--line);padding-left:8px;color:var(--spruce-deep)}
.lang-box svg{width:17px;height:17px;flex:none}
.lang-box select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-family:var(--font-mono);font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:8px 27px 8px 9px;min-width:62px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 12px) 14px,calc(100% - 8px) 14px;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.lang-box select:focus{outline:none;border-color:var(--spruce);box-shadow:var(--ring)}

/* ---------- Nawigacja mobilna ---------- */
.mobile-top{display:none}
.tabbar{display:none}

/* ---------- Karty / KPI ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.kpi:hover{border-color:var(--line-2)}
.kpi .lab{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px;font-weight:600}
.kpi .val{font-weight:700;font-size:24px;letter-spacing:-.02em;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:12.5px;font-weight:600;color:var(--ink-2);margin-left:3px}
.kpi .delta{font-size:12px;margin-top:7px;color:var(--ink-2)}
.kpi.accent{background:linear-gradient(150deg,#EAF6EE,#DFF0E5);border-color:#BFDFC9}
.kpi.accent .lab{color:var(--moss)}
.kpi.accent .val{color:var(--spruce-deep)}
.kpi.accent .val small{color:var(--moss)}
.kpi.accent .delta{color:var(--moss)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h2{font-weight:600;font-size:14.5px;letter-spacing:-.01em;color:var(--ink)}
.card-b{padding:16px 18px}

/* ---------- Pryzmy — wskaźnik stanu ---------- */
.piles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.pile{border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:var(--surface-2);transition:border-color .15s}
.pile:hover{border-color:var(--line-2)}
.pile .p-name{font-size:12.5px;font-weight:600;color:var(--ink);min-height:34px;line-height:1.3}
.pile .p-gauge{height:56px;margin:8px 0 6px;position:relative}
.pile .p-gauge svg{width:100%;height:100%;display:block}
.pile .p-mp{font-weight:700;font-size:18px;letter-spacing:-.01em;color:var(--spruce-deep);font-variant-numeric:tabular-nums}
.pile .p-mp small{font-size:11px;font-weight:600;color:var(--ink-2)}
.pile .p-t{font-size:12px;color:var(--ink-2)}
.pile.neg .p-mp{color:var(--neg)}

/* ---------- Kwit / stempel dokumentu ---------- */
.stamp{display:inline-block;font-family:var(--font-mono);font-weight:600;font-size:11.5px;color:var(--spruce-deep);background:var(--green-tint);border:1px dashed #A9CFB6;border-radius:6px;padding:2px 8px;white-space:nowrap}
.stamp.wz{color:var(--gold);background:var(--amber-soft);border-color:#DFC482}
.stamp.mm{color:#6A4FA3;background:#F1ECFA;border-color:#C9B8E8}

/* ---------- Tagi typów operacji ---------- */
.tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.07em;padding:3px 9px;border-radius:99px;white-space:nowrap}
.tag.ZAKUP{background:#E7F4EB;color:#1F7A45}
.tag.SPRZEDAŻ{background:#FBF4E1;color:#8F6E14}
.tag.PRODUKCJA{background:#E8F0FB;color:#2F62AE}
.tag.ZUŻYCIE{background:#FBEAE8;color:#B0473D}
.tag.MM{background:#F1ECFA;color:#6A4FA3}
.tag.BO{background:#EFF3E6;color:#5F7A2E}

/* ---------- Tabele ---------- */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap;background:var(--surface-2);position:sticky;top:0;font-weight:600;z-index:1}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:nth-child(even) td{background:#FAFCFA}
.tbl tr:hover td{background:#EFF7F1}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.num{font-family:var(--font-mono);font-size:12px}
.tbl .sum td{font-weight:700;background:var(--surface-2);border-top:2px solid var(--line-2)}
.neg-v{color:var(--neg);font-weight:600}
.pos-v{color:var(--pos)}

/* ---------- Formularz ---------- */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px 16px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;background:var(--field);width:100%;transition:border-color .15s,box-shadow .15s}
.fld input::placeholder,.fld textarea::placeholder{color:var(--ink-3)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--spruce);box-shadow:var(--ring)}
.fld .hint{font-size:11.5px;color:var(--ink-3)}
.fld.wide{grid-column:1/-1}
.seg{display:flex;flex-wrap:wrap;gap:7px}
.seg button{border:1px solid var(--line-2);background:#fff;border-radius:99px;padding:8px 15px;font-weight:600;font-size:12.5px;color:var(--ink-2);transition:all .15s}
.seg button:hover{border-color:var(--spruce);color:var(--spruce-deep)}
.seg button.on{background:var(--spruce);border-color:var(--spruce);color:#fff}
.calc-strip{display:flex;flex-wrap:wrap;gap:10px;background:var(--spruce-deep);border:1px solid var(--spruce-deep);border-radius:12px;padding:13px 16px;margin-top:16px}
.calc-strip .ci{flex:1;min-width:105px}
.calc-strip .ci .l{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#A9D3B8;font-weight:600}
.calc-strip .ci .v{font-weight:700;font-size:18px;letter-spacing:-.01em;color:#FFFFFF;font-variant-numeric:tabular-nums}
.calc-strip .ci .v small{font-size:11px;color:#C4E4CF;font-weight:600}

/* ---------- Sekcje formularza ---------- */
.fsec{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:15px 16px;margin-bottom:13px}
.fsec>h3{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--spruce-deep);margin-bottom:13px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.fsec .form-grid{gap:12px 16px}

/* ---------- Pulpit operacyjny ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:11px;margin-bottom:14px}
.stat{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow)}
.stat .s-ic{width:36px;height:36px;border-radius:10px;background:var(--green-tint);color:var(--spruce-deep);display:flex;align-items:center;justify-content:center;flex:none}
.stat .s-ic svg{width:18px;height:18px}
.stat .s-l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:3px;font-weight:600}
.stat .s-v{font-weight:700;font-size:21px;letter-spacing:-.02em;color:var(--ink);line-height:1.05;font-variant-numeric:tabular-nums}
.stat .s-v small{font-size:12px;font-weight:600;color:var(--ink-2)}
.stat .s-d{font-size:12px;color:var(--ink-2);margin-top:3px}
.stat.s-green{background:linear-gradient(150deg,#EAF6EE,#DFF0E5);border-color:#BFDFC9}
.stat.s-green .s-l{color:var(--moss)}.stat.s-green .s-v{color:var(--spruce-deep)}.stat.s-green .s-v small{color:var(--moss)}.stat.s-green .s-d{color:var(--moss)}
.stat.s-green .s-ic{background:#FFFFFF;color:var(--spruce-deep)}
.stat.s-gold{background:linear-gradient(150deg,#FBF4E1,#F6ECD2);border-color:#E5D3A0}
.stat.s-gold .s-l{color:#8F6E14}.stat.s-gold .s-v{color:#6E5510}.stat.s-gold .s-v small{color:#8F6E14}.stat.s-gold .s-d{color:#8F6E14}
.stat.s-gold .s-ic{background:#FFFFFF;color:#8F6E14}
.quick-bar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
.qb{display:inline-flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px 15px 8px 8px;font-weight:600;font-size:13px;color:var(--ink);text-decoration:none;cursor:pointer;box-shadow:var(--shadow);transition:transform .1s,border-color .15s;font-family:inherit}
.qb:hover{border-color:var(--spruce)}
.qb:active{transform:scale(.97)}
.qb-ic{width:30px;height:30px;border-radius:8px;background:var(--green-tint);color:var(--spruce-deep);display:inline-flex;align-items:center;justify-content:center}
.qb-ic svg{width:16px;height:16px}
.chips-filter{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
.chips-filter button{border:1px solid var(--line-2);background:#fff;border-radius:99px;padding:6px 14px;font-weight:600;font-size:12px;color:var(--ink-2);cursor:pointer;transition:all .12s}
.chips-filter button:hover{border-color:var(--spruce);color:var(--spruce-deep)}
.chips-filter button.on{background:var(--spruce);border-color:var(--spruce);color:#fff}
.fab-desk{position:fixed;right:26px;bottom:26px;width:54px;height:54px;border-radius:99px;background:var(--spruce);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(46,158,91,.35);z-index:45;transition:transform .12s,box-shadow .15s}
.fab-desk:hover{transform:scale(1.06);box-shadow:0 12px 30px rgba(46,158,91,.45)}
.fab-desk svg{width:24px;height:24px}
@media (max-width:760px){.fab-desk{display:none}.stat .s-v{font-size:19px}}

/* ---------- Szybkie akcje ---------- */
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.qa button{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--spruce);border-radius:12px;padding:14px 16px;text-align:left;box-shadow:var(--shadow);transition:transform .12s,border-color .15s}
.qa button:hover{border-color:var(--line-2);border-left-color:var(--spruce)}
.qa button:active{transform:scale(.97)}
.qa button .q-i{font-weight:800;font-size:20px;color:var(--spruce);width:30px;text-align:center;flex:none}
.qa button .q-t{font-weight:700;font-size:14px;color:var(--ink)}
.qa button .q-d{font-size:11.5px;color:var(--ink-2)}
.qa button.q-wz{border-left-color:var(--amber)}
.qa button.q-wz:hover{border-left-color:var(--amber)}
.qa button.q-wz .q-i{color:var(--amber)}
.qa button.q-pw{border-left-color:#4C7FD1}
.qa button.q-pw:hover{border-left-color:#4C7FD1}
.qa button.q-pw .q-i{color:#4C7FD1}
@media (max-width:760px){.qa{grid-template-columns:1fr}}

/* ---------- Załączniki (skany) ---------- */
.zal-grid{display:flex;flex-wrap:wrap;gap:10px}
.zal-th{position:relative;width:86px;height:86px;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface-2);cursor:pointer}
.zal-th img{width:100%;height:100%;object-fit:cover;display:block}
.zal-th .z-pdf{display:flex;align-items:center;justify-content:center;height:100%;font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--neg)}
.zal-th .z-x{position:absolute;top:3px;right:3px;width:21px;height:21px;border-radius:99px;border:none;background:rgba(27,43,33,.72);color:#fff;font-size:12px;line-height:1;cursor:pointer}
.zal-add{width:86px;height:86px;border:2px dashed var(--line-2);border-radius:10px;background:transparent;color:var(--ink-2);font-size:26px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:border-color .15s,color .15s}
.zal-add:hover{border-color:var(--spruce);color:var(--spruce-deep)}
.zal-add small{font-size:9.5px;letter-spacing:.06em;font-weight:600}
.zbadge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--spruce-deep);background:var(--green-tint);border:1px solid #BFDFC9;border-radius:99px;padding:1px 8px;white-space:nowrap}
#lb{position:fixed;inset:0;background:rgba(16,28,20,.9);display:none;align-items:center;justify-content:center;z-index:90;padding:20px;cursor:zoom-out}
#lb.open{display:flex}
#lb img{max-width:96%;max-height:92%;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.45)}

/* ---------- Skany dokumentów ---------- */
.scan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px;margin-top:10px}
.scan-th{position:relative;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;aspect-ratio:3/4;background:var(--surface-2);cursor:pointer}
.scan-th img{width:100%;height:100%;object-fit:cover;display:block}
.scan-th .lab{position:absolute;left:0;right:0;bottom:0;background:rgba(27,43,33,.78);color:#fff;font-size:9.5px;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scan-add{border:1.5px dashed var(--line-2);border-radius:10px;aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink-2);font-size:11px;background:transparent;cursor:pointer;text-align:center;padding:6px;transition:border-color .15s,color .15s}
.scan-add:hover{border-color:var(--spruce);color:var(--spruce-deep)}
.scan-add svg{width:22px;height:22px}
.clip{display:inline-flex;align-items:center;gap:2px;font-size:11px;color:var(--gold,#8F7418);background:var(--amber-soft);border-radius:99px;padding:1px 7px;margin-left:6px;font-weight:600;vertical-align:middle}
#viewerBg{position:fixed;inset:0;background:rgba(16,28,20,.92);z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;padding:14px}
#viewerBg.open{display:flex}
#viewerBg img{max-width:96vw;max-height:80vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
#viewerBg .v-bar{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap;justify-content:center}
#viewerBg .v-lab{color:#fff;font-size:13.5px;font-weight:600}

/* ---------- Przyciski ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:10px;padding:9px 17px;font-weight:600;font-size:13.5px;transition:transform .1s,filter .15s,background .15s,border-color .15s;text-decoration:none}

.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px;align-items:center}

.toolbar input[type=search]:focus,.toolbar select:focus,.toolbar input[type=month]:focus{outline:none;border-color:var(--spruce);box-shadow:var(--ring)}
.toolbar input[type=search]{flex:1;min-width:170px}
.toolbar input::placeholder{color:var(--ink-3)}
.count-pill{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2);margin-left:auto;white-space:nowrap}

/* ---------- Karty operacji (mobile) ---------- */
.op-cards{display:none;flex-direction:column;gap:10px}
.op-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;box-shadow:var(--shadow)}
.op-card .r1{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px}
.op-card .r2{font-size:13.5px;font-weight:600;margin-bottom:2px;color:var(--ink)}
.op-card .r3{font-size:12.5px;color:var(--ink-2)}
.op-card .r4{display:flex;justify-content:space-between;align-items:center;margin-top:9px}
.op-card .vol{font-weight:700;font-size:16px;letter-spacing:-.01em;color:var(--spruce-deep);font-variant-numeric:tabular-nums}

/* ---------- Wykres słupkowy ---------- */
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:130px 1fr 74px;align-items:center;gap:10px;font-size:12.5px}

.bar-row.amber .b-fill{background:linear-gradient(90deg,#C89A3C,#DDB45C)}
.bar-row .b-val{font-family:var(--font-mono);font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(22,36,27,.42);display:none;align-items:center;justify-content:center;z-index:60;padding:16px;backdrop-filter:blur(3px)}
.modal-bg.open{display:flex}
.modal-bg.open .modal{animation:pop .18s ease both}
.modal{background:#fff;border:1px solid var(--line);border-radius:16px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:22px;box-shadow:0 24px 70px rgba(18,46,30,.28)}

  .empty{padding:34px 16px;text-align:center;color:var(--ink-2);font-size:13.5px}

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(Array.isArray(d.records)){
        state.records = d.records;
        state.corrections = Array.isArray(d.corrections) ? d.corrections : [];

  state.corrections = [];
  save(false);
}
let saveWarned = false;
function save(toastIt){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }

const i18nTextSource = new WeakMap(), i18nAttrSource = new WeakMap();
const supportedLangs = ['pl','cs','en'];
function currentLang(){ return supportedLangs.includes(state.cfg.lang) ? state.cfg.lang : 'pl'; }
function tr(value){
  const source = String(value??'');
  const map = I18N[currentLang()] || {};
  if(currentLang()==='pl') return source;
  if(Object.prototype.hasOwnProperty.call(map,source)) return map[source];
  return Object.keys(map).sort((a,b)=>b.length-a.length).reduce((out,key)=>out.includes(key) ? out.split(key).join(map[key]) : out, source);
}
function translateTextNode(node){
  const original = i18nTextSource.has(node) ? i18nTextSource.get(node) : node.nodeValue;
  if(!i18nTextSource.has(node)) i18nTextSource.set(node,original);
  const parts = String(original).match(/^(\s*)([\s\S]*?)(\s*)$/);
  node.nodeValue = parts[1] + tr(parts[2]) + parts[3];
}
function translateAttribute(el,attr){
  let source = i18nAttrSource.get(el);
  if(!source){ source={}; i18nAttrSource.set(el,source); }
  if(!(attr in source)) source[attr]=el.getAttribute(attr);
  if(source[attr]!==null){
    const translated=tr(source[attr]);
    el.setAttribute(attr,translated);
    if(attr==='placeholder') el.placeholder=translated;
    if(attr==='title') el.title=translated;
    if(attr==='aria-label') el.setAttribute('aria-label',translated);
  }
}
function updateLanguageTool(){
  const sel=document.getElementById('languageSelect'); if(sel) sel.value=currentLang();
  const labels={pl:{pl:'Polski',cs:'Czeski',en:'Angielski'},cs:{pl:'Polština',cs:'Čeština',en:'Angličtina'},en:{pl:'Polish',cs:'Czech',en:'English'}}[currentLang()];
  if(sel) [...sel.options].forEach(o=>o.textContent=labels[o.value]);
}
function translatePage(){
  document.documentElement.lang=currentLang()==='cs'?'cs':currentLang();
  const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.filter(n=>n.parentElement && !['SCRIPT','STYLE'].includes(n.parentElement.tagName)).forEach(translateTextNode);
  document.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>['placeholder','title','aria-label'].forEach(attr=>{ if(el.hasAttribute(attr)) translateAttribute(el,attr); }));
  updateLanguageTool();
}
let translationQueued=false;
function queueTranslation(){ if(translationQueued) return; translationQueued=true; requestAnimationFrame(()=>{ translationQueued=false; translatePage(); }); }
function initLanguageTools(){
  const nativeConfirm=window.confirm.bind(window);
  window.confirm=message=>nativeConfirm(tr(message));
  document.getElementById('homeTool').addEventListener('click',()=>location.hash='pulpit');
  document.getElementById('printTool').addEventListener('click',()=>window.print());
  document.getElementById('languageSelect').addEventListener('change',e=>{
    state.cfg.lang=supportedLangs.includes(e.target.value)?e.target.value:'pl';
    save(false); route(); queueTranslation();
  });
  new MutationObserver(queueTranslation).observe(document.getElementById('view'),{childList:true,subtree:true});
  queueTranslation();
}

/* ---------- Załączniki: IndexedDB (skany PZ/WZ i kwitów leśnych) ---------- */
const zdb = {
  db:null,
  open(){ return new Promise((res,rej)=>{
    const q = indexedDB.open('resinvest_erp_zal', 1);
    q.onupgradeneeded = e => { const s = e.target.result.createObjectStore('zal',{keyPath:'id'}); s.createIndex('rec','recId'); };
    q.onsuccess = e => { zdb.db = e.target.result; res(); };
    q.onerror = () => rej(q.error);
  });},
  st(m){ return zdb.db.transaction('zal',m).objectStore('zal'); },
  add(recId, data, name){ return new Promise((res,rej)=>{
    const rec = { id: uid()+'z', recId, name: name||'skan', data, ts: Date.now() };
    const r = zdb.st('readwrite').add(rec); r.onsuccess=()=>res(rec); r.onerror=()=>rej(r.error);
  });},
  list(recId){ return new Promise(res=>{ const out=[];
    const r = zdb.st('readonly').index('rec').openCursor(IDBKeyRange.only(recId));
    r.onsuccess = e => { const c=e.target.result; if(c){ out.push(c.value); c.continue(); } else res(out); };
    r.onerror = () => res(out);
  });},
  all(){ return new Promise(res=>{ const out=[];
    const r = zdb.st('readonly').openCursor();
    r.onsuccess = e => { const c=e.target.result; if(c){ out.push(c.value); c.continue(); } else res(out); };
    r.onerror = () => res(out);
  });},
  del(id){ return new Promise(res=>{ const r=zdb.st('readwrite').delete(id); r.onsuccess=res; r.onerror=res; }); },
  put(rec){ return new Promise(res=>{ const r=zdb.st('readwrite').put(rec); r.onsuccess=res; r.onerror=res; }); }
};
let zalCounts = {};
async function refreshZalCounts(){
  if(!zdb.db) return;
  const all = await zdb.all(); zalCounts = {};
  for(const z of all) zalCounts[z.recId] = (zalCounts[z.recId]||0)+1;
  document.querySelectorAll('[data-zb]').forEach(el=>{
    const n = zalCounts[el.dataset.zb]||0;
    el.innerHTML = n ? '<span class="zbadge">🖇 '+n+'</span>' : '';
  });
}
function compressFile(file){ // zdjęcie -> JPEG max 1600px; PDF bez zmian
  return new Promise((res,rej)=>{
    if(file.type === 'application/pdf'){
      const rd = new FileReader(); rd.onload = ()=>res({data: rd.result, name: file.name});
      rd.onerror = ()=>rej(); rd.readAsDataURL(file); return;
    }
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const M = 1600, k = Math.min(1, M/Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res({data: c.toDataURL('image/jpeg', .72), name: file.name});
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}
window.showLb = data => { document.getElementById('lbImg').src = data; document.getElementById('lb').classList.add('open'); };
window.openZal = id => { zdb.st('readonly').get(id).onsuccess = e => {
  const z = e.target.result; if(!z) return;
  if(z.data.startsWith('data:application/pdf')){
    fetch(z.data).then(r=>r.blob()).then(b=>window.open(URL.createObjectURL(b),'_blank'));
  } else showLb(z.data);
};};

function calc(r){
  const c = state.cfg;
  const wol = +r.wolumen || 0;
  let mp, tony;
  if(r.jednostka === 'TONA'){ tony = wol; mp = c.mpTona ? wol / c.mpTona : 0; }
  else { mp = r.jednostka === 'M3' ? wol * c.m3mp : wol; tony = wol * c.mpTona; }
  let mpReal = false, m3Real = false;
  if(r.jednostka === 'M3' && r.mpTryb === 'RECZNIE' && +r.mpReczne > 0){ mp = +r.mpReczne; mpReal = true; }  // rzeczywiste MP — zastępuje wynik przeliczenia M³→MP tej operacji
  let m3 = r.jednostka === 'M3' ? wol : (c.m3mp ? mp / c.m3mp : 0);
  if(r.jednostka === 'MP' && r.m3Tryb === 'RECZNIE' && +r.m3Reczne > 0){ m3 = +r.m3Reczne; m3Real = true; }  // rzeczywiste M³ — zastępuje wynik przeliczenia MP→M³ tej operacji
  if(r.tonyTryb === 'RECZNIE' && +r.tonyReczne > 0){ tony = +r.tonyReczne; }  // waga rzeczywista — tylko prezentacja ton/GJ, MP i stany bez zmian
  const gj = tony * c.tonaGJ;
  const wZak = (+r.cenaZakupu||0) * wol;
  const wSpr = (+r.cenaSprzedazy||0) * wol;
  const wRab = (+r.kosztRabania||0) * wol;
  return { mp, tony, gj, m3, wZak, wSpr, wRab, mpReal, m3Real, tonyReal: r.tonyTryb==='RECZNIE' && +r.tonyReczne>0 };
}
function ruch(r){ // wpływ na stan magazynu: {magazyn: {mp, t}}
  const {mp, tony} = calc(r); const out = {};
  const add = (mag, s) => { if(!mag) return; if(!out[mag]) out[mag]={mp:0,t:0}; out[mag].mp += s*mp; out[mag].t += s*tony; };
  const isMag = n => /magazyn/i.test(n||'');
  if(r.typ==='ZAKUP' || r.typ==='PRODUKCJA' || r.typ==='BO'){ add(isMag(r.odbiorca)?r.odbiorca:'Magazyn RiC Zabrze', +1); }
  else if(r.typ==='SPRZEDAŻ' || r.typ==='ZUŻYCIE'){ add(isMag(r.dostawca)?r.dostawca:'Magazyn RiC Zabrze', -1); }
  else if(r.typ==='MM'){ add(isMag(r.dostawca)?r.dostawca:null,-1); add(isMag(r.odbiorca)?r.odbiorca:null,+1); }
  return out;
}
function stany(){ // {produkt: {magazyn:{mp,t}, total:{mp,t}}}
  const s = {};
  for(const r of state.records){
    const rr = ruch(r); const p = r.produkt || '(bez produktu)';
    if(!s[p]) s[p] = { mags:{}, total:{mp:0,t:0} };
    for(const [mag,v] of Object.entries(rr)){
      if(!s[p].mags[mag]) s[p].mags[mag]={mp:0,t:0};
      s[p].mags[mag].mp += v.mp; s[p].mags[mag].t += v.t;
      s[p].total.mp += v.mp; s[p].total.t += v.t;
    }
  }
  return s;
}

  const ignored = new Set(['id','dataDodania']);

  const fields = keys.map(key=>({ key, label:CORR_LABELS[key]||key, from:before?.[key]??'', to:after?.[key]??'' }));

    before:JSON.parse(JSON.stringify(before))
  });
}

function nextDoc(typ){
  let max=0, re;
  if(typ==='ZAKUP') re=/PZ\/(\d+)/i;
  else if(typ==='SPRZEDAŻ') re=/WZ\/(\d+)/i;
  else if(typ==='MM') re=/MM-(\d+)/i;
  else if(typ==='BO') re=/BO-(\d+)/i;
  else return '';
  for(const r of state.records){ const m=(r.nrDok||'').match(re); if(m) max=Math.max(max,+m[1]); }
  if(typ==='ZAKUP') return 'PZ/'+(max+1);
  if(typ==='SPRZEDAŻ') return 'WZ/'+(max+1);
  if(typ==='BO') return 'BO-'+(max+1);
  return 'MM-'+(max+1);
}

function distinct(field, extra=[]){
  const set = new Set(extra.filter(Boolean));
  for(const r of state.records){ const v=(r[field]||'').trim(); if(v) set.add(v); }

}

      <path d="M0 ${H} L${W*0.30} 6 Q${W*0.5} -4 ${W*0.68} 10 L${W} ${H} Z" fill="${neg?'#E5BDB4':col}"/>

}

    <select id="fP"><option value="">Produkt: wszystkie</option>${prods.map(p=>`<option ${opFilter.prod===p?'selected':''}>${esc(p)}</option>`).join('')}</select>
    <select id="fM"><option value="">Miesiąc: wszystkie</option>${months.map(mm=>`<option value="${mm}" ${opFilter.m===mm?'selected':''}>${monthLabel(mm)}</option>`).join('')}</select>

      <td class="num">${fmt(c.mp)}</td>
      <td class="num">${fmt(c.tony)}</td>
      <td class="num">${w?fmt(w,0)+' zł':'—'}</td>

    <div class="r4"><span class="vol">${fmt(c.mp)} <small style="font-size:11px;color:var(--ink-2)">MP · ${fmt(c.tony)} t</small></span>

  </div>`;}).join('') || '<div class="empty"><b>Nic nie znaleziono</b></div>'}</div>`;

  document.getElementById('fQ').addEventListener('change', rerun);
  document.getElementById('fQ').addEventListener('search', rerun);
  ['fT','fP','fM','fMag'].forEach(id=>document.getElementById(id).addEventListener('change', rerun));
};
function filteredOps(){
  const q = opFilter.q.toLowerCase();
  return state.records.filter(r=>{
    if(opFilter.typ && r.typ!==opFilter.typ) return false;
    if(opFilter.prod && r.produkt!==opFilter.prod) return false;
    if(opFilter.m && monthOf(r)!==opFilter.m) return false;
    if(opFilter.mag && r.dostawca!==opFilter.mag && r.odbiorca!==opFilter.mag) return false;
    if(q){ const hay=[r.nrDok,r.dostawca,r.odbiorca,r.produkt,r.nrRej,r.transportFirma,r.uwagi,r.miejsceZaladunku,r.pochodzenie,r.kwitWywozowy,r.miejsceProdukcji,r.nadlesnictwo,r.lesnictwo,r.podpis].join(' ').toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  }).sort((a,b)=>(b.dataOperacji||'').localeCompare(a.dataOperacji||'') || (b.dataDodania||'').localeCompare(a.dataDodania||''));
}

let editId = null, pendZal = [];
function drawPendZal(){
  const box = document.getElementById('pendZal'); if(!box) return;
  box.querySelectorAll('.zal-th').forEach(x=>x.remove());
  pendZal.forEach((z,i)=>{
    const t = document.createElement('div'); t.className='zal-th';
    t.innerHTML = (z.data.startsWith('data:application/pdf') ? '<div class="z-pdf">PDF</div>' : '<img src="'+z.data+'" alt="">')
      + '<button class="z-x" title="Usuń">×</button>';
    t.querySelector('.z-x').onclick = ev=>{ ev.stopPropagation(); pendZal.splice(i,1); drawPendZal(); };
    t.onclick = ()=>{ if(!z.data.startsWith('data:application/pdf')) showLb(z.data); };
    box.appendChild(t);
  });
}

  document.getElementById('i_konwTryb').addEventListener('change', ()=>{ syncKonwUI(); liveCalc(); });

  document.getElementById('i_tonyTryb').addEventListener('change', ()=>{

function saveForm(again){
  const d = formData();
  if(!d.produkt){ toast('Podaj produkt'); return; }
  if(!(d.wolumen>0)){ toast('Podaj wolumen większy od zera'); return; }
  if(!d.dataOperacji){ toast('Podaj datę operacji'); return; }
  if(d.podpis.split(/\s+/).filter(Boolean).length < 2){ toast('Podpisz dokument pełnym imieniem i nazwiskiem'); document.getElementById('i_podpis').focus(); return; }
  const zapiszSkany = async recId => {
    for(const z of pendZal){ try{ await zdb.add(recId, z.data, z.name); }catch(_){ toast('Skan nie zapisany: '+z.name); } }
    if(pendZal.length) toast('Zapisano skany: '+pendZal.length);
    pendZal = []; refreshZalCounts();
  };
  const chP = document.getElementById('chkProdukcja'), chS = document.getElementById('chkSprzedaz');
  const chain = !editId && d.typ==='ZAKUP' && chP && chP.checked;
  if(chain){
    const chProdukt = document.getElementById('i_chProdukt').value.trim() || 'Zrębka Produkcyjna Leśna';
    const zakupMp = d.jednostka==='M3' ? d.wolumen*state.cfg.m3mp : d.wolumen;
    const chWolumen = +(document.getElementById('i_chWolumen').value) || zakupMp;
    const sprz = chS && chS.checked;
    const chOdb = document.getElementById('i_chOdbiorca').value.trim();
    const chCena = +(document.getElementById('i_chCena').value) || 0;
    if(!(chWolumen>0)){ toast('Wolumen produkcji musi być większy od zera'); return; }
    if(sprz && (!chOdb || !(chCena>0))){ toast('Sprzedaż: podaj odbiorcę i cenę większą od zera'); return; }
    const pzNr = d.nrDok || nextDoc('ZAKUP');
    const wspolne = { dataOperacji:d.dataOperacji, dataZaladunku:d.dataZaladunku, certyfikat:d.certyfikat,
      nadlesnictwo:d.nadlesnictwo, lesnictwo:d.lesnictwo,
      miejsceZaladunku:d.miejsceZaladunku, pochodzenie:d.pochodzenie, dostawca:d.dostawca,
      rodzaj:d.rodzaj, podpis:d.podpis, lancuch:pzNr };
    // 1. ZAKUP — magazynowane NIE, bo surowiec od razu idzie do produkcji (logika z makra Excela)
    const zakup = Object.assign({}, d, wspolne, { id:uid(), nrDok:pzNr, magazynowane:'NIE',
      cenaSprzedazy:0, kosztRabania:0, kwitWywozowy:'',
      transportFirma:'', nrRej:'', odlegloscKm:0, kosztTransportu:0, dataDodania:nowIso() });
    state.records.push(zakup);
    // 2. ZUŻYCIE — tyle, ile kupiono; ten sam produkt (jak w makrze)
    state.records.push(Object.assign({}, wspolne, { id:uid(), typ:'ZUŻYCIE', nrDok:pzNr,
      produkt:d.produkt, wolumen:d.wolumen, jednostka:d.jednostka, magazynowane:'NIE',
      cenaZakupu:0, cenaSprzedazy:0, rabanie:'', kosztRabania:0, transportFirma:'', nrRej:'',
      odlegloscKm:0, kosztTransportu:0, odbiorca:d.odbiorca, miejsceProdukcji:'', kwitWywozowy:'',
      uwagi:'Automatyczne zużycie surowca', dataDodania:nowIso() }));
    // 3. PRODUKCJA — produkt i wolumen z panelu; koszt rąbania tylko tutaj (bez dublowania kosztów)
    state.records.push(Object.assign({}, wspolne, { id:uid(), typ:'PRODUKCJA', nrDok:pzNr,
      produkt:chProdukt, wolumen:chWolumen, jednostka:'MP', magazynowane: sprz?'NIE':'TAK',
      cenaZakupu:0, cenaSprzedazy:0, rabanie:d.rabanie, kosztRabania:d.kosztRabania,
      kwitWywozowy: sprz?'':d.kwitWywozowy,
      transportFirma: sprz?'':d.transportFirma, nrRej: sprz?'':d.nrRej,
      odlegloscKm: sprz?0:d.odlegloscKm, kosztTransportu: sprz?0:d.kosztTransportu,
      odbiorca:d.odbiorca, miejsceProdukcji:'',
      uwagi: sprz?'Automatyczna produkcja z zakupionego surowca':'Automatyczna produkcja — wywóz zrębki na magazyn',
      dataDodania:nowIso() }));
    let wzNr = '';
    if(sprz){
      wzNr = nextDoc('SPRZEDAŻ');
      // 4. SPRZEDAŻ — prosto do elektrowni, bez magazynowania; transport przypisany do WZ
      state.records.push(Object.assign({}, wspolne, { id:uid(), typ:'SPRZEDAŻ', nrDok:wzNr,
        produkt:chProdukt, wolumen:chWolumen, jednostka:'MP', magazynowane:'NIE',
        cenaZakupu:0, cenaSprzedazy:chCena, rabanie:'', kosztRabania:0,
        kwitWywozowy:d.kwitWywozowy,
        transportFirma:d.transportFirma, nrRej:d.nrRej, odlegloscKm:d.odlegloscKm, kosztTransportu:d.kosztTransportu,
        dostawca:d.dostawca, odbiorca:chOdb, miejsceProdukcji:'',
        uwagi:'Automatyczna sprzedaż — wywóz prosto do odbiorcy', dataDodania:nowIso() }));
    }
    state.cfg.uzytkownik = d.podpis;
    save('Łańcuch zapisany: '+pzNr+' + zużycie + produkcja'+(sprz?' + '+wzNr:''));
    zapiszSkany(zakup.id).then(()=>{ if(again){ VIEWS.nowa(); } else { location.hash='operacje'; } });
    return;
  }
  if(editId){
    const i = state.records.findIndex(x=>x.id===editId);
    const before = JSON.parse(JSON.stringify(state.records[i]));
    const updated = Object.assign({}, state.records[i], d);
    registerCorrection(before, updated);
    state.records[i] = updated;
    const rid = editId; editId = null; save('Zmiany zapisane');
    zapiszSkany(rid).then(()=>{ location.hash='operacje'; });
  } else {
    d.id = uid(); d.dataDodania = nowIso();
    state.cfg.uzytkownik = d.podpis;
    state.records.push(d); save('Operacja '+d.nrDok+' zapisana');
    zapiszSkany(d.id).then(()=>{ if(again){ VIEWS.nowa(); } else { location.hash='operacje'; } });
  }
}

};

function prodDays(){ // daty z operacjami PRODUKCJA, malejąco
  return [...new Set(state.records.filter(r=>r.typ==='PRODUKCJA' && r.dataOperacji).map(r=>r.dataOperacji))].sort().reverse();
}
function prodReport(d){
  const prod = state.records.filter(r=>r.typ==='PRODUKCJA' && r.dataOperacji===d);
  const zuz  = state.records.filter(r=>r.typ==='ZUŻYCIE'   && r.dataOperacji===d);
  const wyd  = state.records.filter(r=>r.typ==='SPRZEDAŻ'  && r.dataOperacji===d);
  const perProd = {}; let tot = {mp:0,t:0,gj:0,rab:0,wol:0};
  const docs = new Set();
  for(const r of prod){ const c=calc(r);
    const p=r.produkt||'—';
    if(!perProd[p]) perProd[p]={mp:0,t:0,gj:0,n:0,zrodla:new Set()};
    perProd[p].mp+=c.mp; perProd[p].t+=c.tony; perProd[p].gj+=c.gj; perProd[p].n++;
    const _l=lasStr(r)||r.pochodzenie; if(_l) perProd[p].zrodla.add(_l);
    tot.mp+=c.mp; tot.t+=c.tony; tot.gj+=c.gj; tot.rab+=c.wRab; tot.wol+=(+r.wolumen||0);
    String(r.nrDok||'').split(',').map(s=>s.trim()).filter(Boolean).forEach(s=>docs.add(s));
  }
  const surowce = zuz.map(r=>{const c=calc(r); return {produkt:r.produkt, mp:c.mp, t:c.tony, zrodlo:lasStr(r)||r.pochodzenie||r.miejsceZaladunku||'', dok:r.nrDok||''};});
  const kwity = [...new Set(state.records.filter(r=>r.dataOperacji===d && r.kwitWywozowy).map(r=>r.kwitWywozowy))];
  const lasy = [...new Set(prod.map(r=>lasStr(r)).filter(Boolean))];
  const wzDocs = wyd.map(r=>(r.nrDok||'').split(' ')[0]).filter(Boolean);
  return { date:d, prod, perProd, tot, docs:[...docs], surowce, wzDocs, kwity, lasy, n:prod.length };
}

/* ---------- RAPORT DNIA: operacje magazynowe + e-mail ---------- */
function dayOps(d){
  return state.records.filter(r=>r.dataOperacji===d)
    .sort((a,b)=>(a.typ||'').localeCompare(b.typ||'','pl') || String(a.nrDok||'').localeCompare(String(b.nrDok||''),'pl'));
}
function daySums(d){
  const ops = dayOps(d); const per = {}; let zak=0, spr=0, tr=0, mpIn=0, mpOut=0;
  for(const r of ops){ const c = calc(r);
    if(!per[r.typ]) per[r.typ] = {n:0, mp:0};
    per[r.typ].n++; per[r.typ].mp += c.mp;
    zak += c.wZak; spr += c.wSpr; tr += (+r.kosztTransportu||0);
    if(r.typ==='ZAKUP'||r.typ==='PRODUKCJA'||r.typ==='BO') mpIn += c.mp;
    if(r.typ==='SPRZEDAŻ'||r.typ==='ZUŻYCIE') mpOut += c.mp;
  }
  return {ops, per, zak, spr, tr, mpIn, mpOut};
}
function dayCardHTML(d){
  const s = daySums(d);
  if(!s.ops.length) return '<div class="empty"><b>Brak operacji w tym dniu</b>Wybierz inną datę albo dodaj operację.</div>';
  const chips = TYPY.filter(t=>s.per[t]).map(t=>`<span class="tag ${t}">${t} · ${s.per[t].n}</span>`).join(' ');
  const rows = s.ops.map(r=>{ const c=calc(r); const w=c.wSpr||c.wZak;
    const kontr = r.typ==='SPRZEDAŻ'||r.typ==='MM' ? r.odbiorca : (/^magazyn/i.test(r.dostawca||'')? r.miejsceZaladunku||r.dostawca : r.dostawca);
    return `<tr><td><span class="tag ${esc(r.typ)}">${esc(r.typ)}</span></td>
      <td><span class="${stampCls(r.nrDok)}">${esc((r.nrDok||'—').split(' ')[0])}</span></td>
      <td>${esc(r.produkt||'—')}</td>
      <td style="max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(kontr||'—')}</td>
      <td class="num">${fmt(c.mp)}${c.mpReal?'<span title="wartość rzeczywista" style="color:var(--amber);font-weight:700">*</span>':''}</td><td class="num">${fmt(c.tony)}${c.tonyReal?'<span title="wartość rzeczywista" style="color:var(--amber);font-weight:700">*</span>':''}</td>
      <td class="num">${w?fmt(w,0)+' zł':'—'}</td>
      <td class="num">${(+r.kosztTransportu)?fmt(r.kosztTransportu,0)+' zł':'—'}</td></tr>`; }).join('');
  return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">${chips}
      <span style="margin-left:auto;font-size:12px;color:var(--ink-2)">przyjęcia <b style="color:var(--pos)">+${fmt(s.mpIn)} MP</b> · wydania <b style="color:var(--neg)">−${fmt(s.mpOut)} MP</b></span></div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Typ</th><th>Dokument</th><th>Produkt</th><th>Kontrahent</th><th class="num">MP</th><th class="num">Tony</th><th class="num">Wartość</th><th class="num">Transport</th></tr></thead>
      <tbody>${rows}<tr class="sum"><td colspan="4">Sumy dnia</td><td class="num">${fmt(s.mpIn - s.mpOut)}</td><td class="num"></td>
        <td class="num">zakup ${fmt(s.zak,0)} zł · sprzedaż ${fmt(s.spr,0)} zł</td><td class="num">${fmt(s.tr,0)} zł</td></tr></tbody>
    </table></div>`;
}
function dayReportText(d){
  const s = daySums(d);
  const L = ['RAPORT DNIA - '+dShort(d), 'Magazyn RiC Zabrze - ResInvest Commodities PL', ''];
  L.push('Operacje: '+s.ops.length+(s.ops.length?' ('+TYPY.filter(t=>s.per[t]).map(t=>t+' '+s.per[t].n).join(', ')+')':''));
  s.ops.slice(0,20).forEach(r=>{ const c=calc(r); const w=c.wSpr||c.wZak;
    L.push('- '+(r.nrDok?(r.nrDok+' '):'')+r.typ+' '+(r.produkt||'')+' '+fmt(c.mp)+' MP'+(c.mpReal?' (wartosc rzeczywista)':'')+(w?' '+fmt(w,0)+' zl':'')); });
  if(s.ops.length>20) L.push('- ... i '+(s.ops.length-20)+' kolejnych (pelna lista w aplikacji)');
  L.push('');
  L.push('SUMY: przyjecia +'+fmt(s.mpIn)+' MP, wydania -'+fmt(s.mpOut)+' MP');
  L.push('Zakupy: '+fmt(s.zak,0)+' zl, sprzedaz: '+fmt(s.spr,0)+' zl, transport: '+fmt(s.tr,0)+' zl');
  L.push(''); L.push('Wygenerowano w ResInvest ERP');
  return L.join('\n');
}
function prodDayText(d){
  const P = state.records.filter(r=>r.typ==='PRODUKCJA' && r.dataOperacji===d);
  const Z = state.records.filter(r=>r.typ==='ZUŻYCIE'   && r.dataOperacji===d);
  let mp=0, tn=0; const lines = P.map(r=>{ const c=calc(r); mp+=c.mp; tn+=c.tony; return '- '+(r.produkt||'')+': '+fmt(c.mp)+' MP'+(c.mpReal?' (wartosc rzeczywista)':'')+' ('+fmt(c.tony)+' t'+(c.tonyReal?' — waga rzeczywista':'')+')'; });
  let zmp=0; Z.forEach(r=>{ zmp+=calc(r).mp; });
  return ['KWIT PRODUKCJI DNIA - '+dShort(d), 'Magazyn RiC Zabrze - ResInvest Commodities PL', '',
    'Wyprodukowano ('+P.length+' partii):', (lines.join('\n')||'- brak produkcji'),
    'Razem: '+fmt(mp)+' MP / '+fmt(tn)+' t', 'Zuzyty surowiec: '+fmt(zmp)+' MP', '',
    'Wygenerowano w ResInvest ERP'].join('\n');
}

VIEWS.kontrahenci = function(){

      const o=odb[r.odbiorca]; o.mp+=c.mp; o.t+=c.tony; o.wz+=c.wZak; o.ws+=c.wSpr; o.tr+=(+r.kosztTransportu||0); o.n++; }

/* ---------- RAPORTY ---------- */
let rapM = '';
VIEWS.raporty = function(){
  const months = monthsAvailable();
  if(!rapM || !months.includes(rapM)) rapM = months[0] || today().slice(0,7);
  const recs = state.records.filter(r=>monthOf(r)===rapM);
  const tot = {zak:{mp:0,w:0}, spr:{mp:0,w:0}, prod:{mp:0}, tr:0, rab:0};
  const perProd = {}, perDay = {}, perTrans = {};
  for(const r of recs){ const c=calc(r);
    if(r.typ==='ZAKUP'){tot.zak.mp+=c.mp;tot.zak.w+=c.wZak;}
    if(r.typ==='SPRZEDAŻ'){tot.spr.mp+=c.mp;tot.spr.w+=c.wSpr;}
    if(r.typ==='PRODUKCJA'){tot.prod.mp+=c.mp;}
    tot.tr+=(+r.kosztTransportu||0); tot.rab+=c.wRab;
    const p=r.produkt||'—'; if(!perProd[p])perProd[p]={mp:0}; perProd[p].mp+=c.mp;
    const day=(r.dataOperacji||'').slice(8,10); if(day){ if(!perDay[day])perDay[day]=0; perDay[day]+=c.mp; }
    if(r.transportFirma){ if(!perTrans[r.transportFirma])perTrans[r.transportFirma]={n:0,kw:0}; perTrans[r.transportFirma].n++; perTrans[r.transportFirma].kw+=(+r.kosztTransportu||0); }
  }
  const maxProd = Math.max(1,...Object.values(perProd).map(x=>x.mp));
  const maxDay = Math.max(1,...Object.values(perDay));
  V.innerHTML = pageHead('Raport miesięczny','Zestawienie okresu',
    `<select id="rapMSel" class="btn-ghost" style="border:1.5px solid var(--line);border-radius:10px;padding:9px 13px;background:#fff;font-weight:600">${months.map(m=>`<option value="${m}" ${m===rapM?'selected':''}>${monthLabel(m)}</option>`).join('')}</select>
     <button class="btn btn-ghost" onclick="window.print()">${IC.print} Drukuj</button>`) +
  `<div class="kpi-grid">
    <div class="kpi"><div class="lab">Zakupy surowca</div><div class="val">${fmt(tot.zak.mp,0)}<small>MP</small></div><div class="delta">${zl(tot.zak.w)}</div></div>
    <div class="kpi"><div class="lab">Sprzedaż</div><div class="val">${fmt(tot.spr.mp,0)}<small>MP</small></div><div class="delta">${zl(tot.spr.w)}</div></div>
    <div class="kpi"><div class="lab">Produkcja zrębki</div><div class="val">${fmt(tot.prod.mp,0)}<small>MP</small></div><div class="delta">rąbanie: ${zl(tot.rab)}</div></div>
    <div class="kpi"><div class="lab">Koszty transportu</div><div class="val">${fmt(tot.tr,0)}<small>zł</small></div><div class="delta">${recs.length} operacji</div></div>
  </div>
  <div class="grid-2">
    <div class="card"><div class="card-h"><h2>Wolumen wg produktu (MP)</h2></div><div class="card-b"><div class="bars">${
      Object.entries(perProd).sort((a,b)=>b[1].mp-a[1].mp).map(([p,x])=>`<div class="bar-row"><span class="b-lab" title="${esc(p)}">${esc(p)}</span><span class="b-track"><span class="b-fill" style="width:${(x.mp/maxProd*100).toFixed(1)}%"></span></span><span class="b-val">${fmt(x.mp,0)}</span></div>`).join('') || '<div class="empty">Brak danych</div>'
    }</div></div></div>
    <div class="card"><div class="card-h"><h2>Aktywność dzienna (MP)</h2></div><div class="card-b"><div class="bars">${
      Object.entries(perDay).sort().map(([d,v])=>`<div class="bar-row amber"><span class="b-lab">${d}.${rapM.slice(5,7)}</span><span class="b-track"><span class="b-fill" style="width:${(v/maxDay*100).toFixed(1)}%"></span></span><span class="b-val">${fmt(v,0)}</span></div>`).join('') || '<div class="empty">Brak danych</div>'
    }</div></div></div>
  </div>
  <div style="height:16px"></div>
  <div class="card"><div class="card-h"><h2>Transport w miesiącu</h2></div><div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Przewoźnik / kierowca</th><th class="num">Kursy</th><th class="num">Koszt</th><th class="num">Śr. koszt kursu</th></tr></thead>
    <tbody>${Object.entries(perTrans).sort((a,b)=>b[1].kw-a[1].kw).map(([k,v])=>`<tr><td style="font-weight:600">${esc(k)}</td><td class="num">${v.n}</td><td class="num">${fmt(v.kw,0)} zł</td><td class="num">${fmt(v.kw/v.n,0)} zł</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Brak danych</td></tr>'}</tbody>
  </table></div></div>`;
  document.getElementById('rapMSel').addEventListener('change', e=>{ rapM=e.target.value; VIEWS.raporty(); });
};

window.showCorrectionRecord = id => {
  const r = state.records.find(x=>x.id===id);
  if(!r){ toast('Ten wpis nie jest już dostępny w rejestrze'); return; }
  showDetail(id);
};
window.restoreCorrection = id => {
  const c = state.corrections.find(x=>x.id===id);
  const i = c ? state.records.findIndex(x=>x.id===c.recId) : -1;
  if(!c || i<0 || !c.before){ toast('Nie można przywrócić tej korekty'); return; }
  if(!confirm('Przywrócić dokument '+(state.records[i].nrDok||'')+' do stanu sprzed wybranej korekty? Ta operacja zostanie zapisana w historii.')) return;
  const current = state.records[i];
  const restored = Object.assign({}, c.before, {id:current.id, dataDodania:current.dataDodania});
  registerCorrection(current, restored);
  state.records[i] = restored;
  save('Przywrócono poprzednią wersję dokumentu');
  VIEWS.korekty();
};

/* ---------- Eksport / import ---------- */
function download(name, content, mime){
  const blob = new Blob([content], {type: mime});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 400);
}
window.exportJSON = function(){
  const stamp = new Date().toISOString().slice(0,10);
  download('ResInvest_ERP_kopia_'+stamp+'.json', JSON.stringify(state, null, 1), 'application/json');
  toast('Kopia JSON pobrana — zapisz na dysku firmowym');
};
window.exportFull = async function(){
  const skany = await idbAll();
  const stamp = new Date().toISOString().slice(0,10);
  download('ResInvest_ERP_pelna_kopia_'+stamp+'.json', JSON.stringify({...state, skany}), 'application/json');
  toast('Pełna kopia pobrana ('+skany.length+' skanów)');
};
window.importJSON = function(mode){
  const inp = document.getElementById('jsonFile');
  inp.onchange = ()=>{
    const f = inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      try{
        const d = JSON.parse(rd.result);
        const recs = Array.isArray(d) ? d : d.records;
        if(!Array.isArray(recs)) throw new Error('brak rejestru');
        if(mode==='replace'){
          state.records = recs;
          state.corrections = Array.isArray(d.corrections) ? d.corrections : [];
          if(d.cfg) Object.assign(state.cfg, d.cfg);
        }
        if(Array.isArray(d.skany) && idb){ (async()=>{ let ns=0; for(const s of d.skany){ try{ await skanPut(s); ns++; }catch(e){} } await refreshScanCounts(); if(ns) toast('Wczytano '+ns+' skanów'); route(); })(); }
        else {
          const ids = new Set(state.records.map(r=>r.id));
          let n=0; for(const r of recs){ if(!ids.has(r.id)){ state.records.push(r); n++; } }
          if(Array.isArray(d.corrections)){
            const corrIds = new Set(state.corrections.map(c=>c.id));
            d.corrections.forEach(c=>{ if(c && !corrIds.has(c.id)) state.corrections.push(c); });
          }
          toast('Dopisano '+n+' operacji');
        }
        save(mode==='replace'?'Dane zastąpione ('+recs.length+' operacji)':false); route();
      }catch(e){ toast('Nie udało się wczytać pliku: to nie jest kopia ERP'); }
      inp.value='';
    };
    rd.readAsText(f);
  };
  inp.click();
};
window.exportCSV = function(){
  const H = ['Data operacji','Typ','Nr dokumentu','Produkt','Rodzaj','Dostawca','Odbiorca','Miejsce załadunku','Wolumen','Jednostka','MP','Tony','GJ','Cena zakupu','Wartość zakupu','Cena sprzedaży','Wartość sprzedaży','Koszt rąbania/jedn.','Koszt rąbania razem','Transport','Nr rej.','Km','Koszt transportu','Certyfikat','Magazynowane','Nadleśnictwo','Leśnictwo','Kwit wywozowy','Pochodzenie','Podpis','Uwagi'];
  const cell = v => '"'+String(v??'').replace(/"/g,'""')+'"';
  const numc = v => String(Math.round(v*10000)/10000).replace('.',',');
  const rows = filteredOps().map(r=>{const c=calc(r);return [
    r.dataOperacji,r.typ,r.nrDok,r.produkt,r.rodzaj,r.dostawca,r.odbiorca,r.miejsceZaladunku,
    numc(+r.wolumen||0),r.jednostka,numc(c.mp),numc(c.tony),numc(c.gj),
    numc(+r.cenaZakupu||0),numc(c.wZak),numc(+r.cenaSprzedazy||0),numc(c.wSpr),
    numc(+r.kosztRabania||0),numc(c.wRab),r.transportFirma,r.nrRej,numc(+r.odlegloscKm||0),numc(+r.kosztTransportu||0),
    r.certyfikat,r.magazynowane,r.nadlesnictwo,r.lesnictwo,r.kwitWywozowy,r.pochodzenie,r.podpis,r.uwagi].map(cell).join(';');});
  const csv = '\uFEFF'+H.map(cell).join(';')+'\r\n'+rows.join('\r\n');
  download('ResInvest_operacje_'+new Date().toISOString().slice(0,10)+'.csv', csv, 'text/csv;charset=utf-8');
  toast('CSV pobrany ('+rows.length+' operacji)');
};

/* ---------- SKANY DOKUMENTÓW (IndexedDB — zdjęcia PZ, kwitów leśnych) ---------- */
let idb = null, scanCounts = {};
function idbOpen(){
  return new Promise((res)=>{
    if(!window.indexedDB){ res(null); return; }
    const q = indexedDB.open('resinvest_skany', 1);
    q.onupgradeneeded = e => {
      const db = e.target.result;
      const st = db.createObjectStore('skany', {keyPath:'id'});
      st.createIndex('recId','recId',{unique:false});
    };
    q.onsuccess = e => { idb = e.target.result; res(idb); };
    q.onerror = () => { console.warn('IndexedDB niedostępne'); res(null); };
  });
}
function idbAll(){ return new Promise(res=>{ if(!idb) return res([]);
  const q = idb.transaction('skany').objectStore('skany').getAll();
  q.onsuccess = ()=>res(q.result||[]); q.onerror = ()=>res([]); }); }
function skanyFor(recId){ return new Promise(res=>{ if(!idb) return res([]);
  const q = idb.transaction('skany').objectStore('skany').index('recId').getAll(recId);
  q.onsuccess = ()=>res(q.result||[]); q.onerror = ()=>res([]); }); }
function skanPut(s){ return new Promise((res,rej)=>{ if(!idb) return rej();
  const q = idb.transaction('skany','readwrite').objectStore('skany').put(s);
  q.onsuccess = res; q.onerror = ()=>rej(q.error); }); }
function skanDel(id){ return new Promise(res=>{ if(!idb) return res();
  const q = idb.transaction('skany','readwrite').objectStore('skany').delete(id);
  q.onsuccess = res; q.onerror = res; }); }
async function skanyDelForRec(recId){ const s = await skanyFor(recId); for(const x of s) await skanDel(x.id); await refreshScanCounts(); }
async function refreshScanCounts(){
  const all = await idbAll(); scanCounts = {};
  for(const s of all){ scanCounts[s.recId] = (scanCounts[s.recId]||0)+1; }
}
function scanBadge(recId){ const c = scanCounts[recId]; return c ? `<span class="clip" title="${c} skan(y)">&#128206;${c}</span>` : ''; }

function compressImage(file, maxDim=1600, q=0.72){
  return new Promise((res,rej)=>{
    const rd = new FileReader();
    rd.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, hh=img.height;
        const k = Math.min(1, maxDim/Math.max(w,hh)); w=Math.round(w*k); hh=Math.round(hh*k);
        const cv = document.createElement('canvas'); cv.width=w; cv.height=hh;
        cv.getContext('2d').drawImage(img,0,0,w,hh);
        res(cv.toDataURL('image/jpeg', q));
      };
      img.onerror = rej; img.src = rd.result;
    };
    rd.onerror = rej; rd.readAsDataURL(file);
  });
}
window.addScans = function(recId){
  const label = document.getElementById('scanLabel') ? document.getElementById('scanLabel').value : 'Skan';
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.multiple=true; inp.capture='environment';
  inp.onchange = async ()=>{
    if(!inp.files.length) return;
    if(!idb){ toast('Skany niedostępne w tej przeglądarce'); return; }
    let n=0;
    for(const f of inp.files){
      try{
        const data = await compressImage(f);
        await skanPut({ id:'SKN-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
          recId, label, data, ts:new Date().toISOString() });
        n++;
      }catch(e){ console.warn('skan pominięty', e); }
    }
    await refreshScanCounts();
    toast(n+' skan(y) zapisane');
    renderSkany(recId);
  };
  inp.click();
};
async function renderSkany(recId){
  const box = document.getElementById('skanGrid'); if(!box) return;
  const list = await skanyFor(recId);
  box.innerHTML = list.map(s=>
    `<div class="scan-th" onclick="openViewer('${s.id}','${esc(s.label)}','${recId}')"><img src="${s.data}" alt="${esc(s.label)}" loading="lazy"><div class="lab">${esc(s.label)}</div></div>`).join('') +
    `<button class="scan-add" onclick="addScans('${recId}')">${IC.plus}<span>Dodaj skan<br>(aparat / plik)</span></button>`;
  const cnt = document.getElementById('skanCnt'); if(cnt) cnt.textContent = list.length ? '('+list.length+')' : '';
}
let viewerCur = null;
window.openViewer = async function(id, label, recId){
  const list = await skanyFor(recId);
  const s = list.find(x=>x.id===id); if(!s) return;
  viewerCur = {id, recId};
  document.getElementById('viewerImg').src = s.data;
  document.getElementById('viewerLab').textContent = label + ' · ' + (s.ts||'').slice(0,10);
  const dl = document.getElementById('viewerDl');
  dl.href = s.data; dl.download = (label||'skan').replace(/\s+/g,'_') + '_' + id + '.jpg';
  document.getElementById('viewerBg').classList.add('open');
};
window.closeViewer = ()=>{ document.getElementById('viewerBg').classList.remove('open'); viewerCur=null; };
document.getElementById('viewerBg').addEventListener('click', e=>{ if(e.target.id==='viewerBg') closeViewer(); });
document.getElementById('viewerDel').addEventListener('click', async ()=>{
  if(!viewerCur) return;
  if(!confirm('Usunąć ten skan?')) return;
  await skanDel(viewerCur.id); await refreshScanCounts();
  const rid = viewerCur.recId; closeViewer(); renderSkany(rid); toast('Skan usunięty');
});

  if(!state.cfg.slowniki || typeof state.cfg.slowniki!=='object') state.cfg.slowniki = base;
