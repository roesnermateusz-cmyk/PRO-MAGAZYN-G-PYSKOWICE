; =====================================================================
;  PRO-MAGAZYN - konfiguracja srodowiska
;  ---------------------------------------------------------------
;  Plik czytany przez instalator Windows przy pierwszej instalacji.
;  Po instalacji parametry biznesowe zmienia sie w arkuszu USTAWIENIA
;  wewnatrz skoroszytu - to one maja pierwszenstwo w dzialaniu systemu.
; =====================================================================

[aplikacja]
nazwa    = PRO-MAGAZYN
wersja   = 2.0.0
plik     = PRO-MAGAZYN.xlsm

[firma]
nazwa    = ResInvest Commodities
magazyn  = Magazyn Pyskowice

[sciezki]
; Puste = katalog Dokumenty biezacego uzytkownika.
katalog_roboczy = 
; Puste = podfolder "Kopie zapasowe" obok pliku roboczego.
katalog_kopii   = 

[transport]
; Stawka za kilometr transportu w zlotych.
stawka_za_km = 5.00

[przeliczniki]
; Ile ton wazy 1 metr przestrzenny.
mp_na_tone  = 0.33
; Ile metrow przestrzennych daje 1 m3.
m3_na_mp    = 4
; Ile gigadzuli energii daje 1 tona.
gj_na_tone  = 8.5

[ewidencja]
; Limit wstecznego datowania operacji (w dniach roboczych, 0 = bez limitu).
max_dni_roboczych_wstecz = 2
; Limit datowania w przod (w dniach, 0 = bez limitu).
max_dni_wprzod           = 30
; Czy pole "Utworzyl" jest obowiazkowe.
wymagaj_pola_utworzyl    = TAK
; Ostrzeganie przy powtorzonym numerze WZ.
ostrzegaj_o_dublach      = TAK

[kopie_zapasowe]
; Kopia przy pierwszym zapisie w danym dniu.
automatyczne        = TAK
; Ile ostatnich kopii zachowac.
kopie_do_zachowania = 30
